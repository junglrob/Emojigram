<style>
  :root {
    --bg1: #1a1a2e;
    --bg2: #16213e;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #8a90a0;
    --accent: #e94560;
    --tile: #f0f2f7;
    --tile-hidden: #e2e5ee;
    --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px;
    color: var(--ink);
  }
  .app { width: 100%; max-width: 440px; }

  .brand { text-align: center; color: #fff; margin-bottom: 10px; }
  .brand h1 { font-size: 28px; letter-spacing: 1px; }
  .brand h1 span { color: var(--accent); }
  .brand p { color: #aab; font-size: 13px; margin-top: 2px; }

  .streak-bar {
    text-align: center;
    color: #ffd76e;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    min-height: 18px;
  }

  .days { display: flex; gap: 5px; margin-bottom: 14px; }
  .day-tab {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 8px 2px;
    text-align: center;
    cursor: pointer;
    color: #ccd;
    font-size: 11px;
    transition: all .15s;
    position: relative;
  }
  .day-tab .demoji { font-size: 18px; display: block; margin-bottom: 2px; }
  .day-tab.active { background: #fff; color: var(--ink); font-weight: 600; }
  .day-tab.locked { opacity: 0.45; cursor: default; }
  .day-tab.today::after {
    content: "";
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }
  .day-tab.done-solved .demoji::after { content: " ✔"; font-size: 10px; color: var(--green); }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .theme-banner { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .theme-name { font-weight: 700; font-size: 17px; padding: 4px 12px; border-radius: 999px; color: #fff; }
  .puzzle-num { color: var(--muted); font-size: 13px; }

  .tiles { display: flex; gap: 8px; justify-content: center; margin: 8px 0 18px; }
  .tile {
    width: 64px; height: 64px;
    border-radius: 14px;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    transition: transform .2s;
  }
  .tile.hidden-tile { background: var(--tile-hidden); color: #b9bdcc; font-size: 24px; }
  .tile.just-revealed { animation: pop .35s ease; }
  @keyframes pop {
    0% { transform: scale(0.3) rotate(-12deg); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .guess-row { display: flex; gap: 8px; }
  .guess-row input {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #dfe3ec;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
  }
  .guess-row input:focus { border-color: var(--accent); }
  .guess-row button {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .guess-row button:active { transform: scale(0.97); }

  .aux-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; min-height: 24px; }
  .hint-btn, .giveup-btn {
    background: none; border: none; color: var(--muted);
    font-size: 13px; cursor: pointer; text-decoration: underline;
  }
  .giveup-btn { color: #c0392b; display: none; }
  .feedback { font-size: 13px; color: #c0392b; font-weight: 600; }

  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .result { display: none; text-align: center; margin-top: 6px; }
  .result .big { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .result .answer-line { font-size: 15px; margin-bottom: 10px; }
  .result .fact {
    background: var(--tile);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: #555c6e;
    margin-bottom: 14px;
    text-align: left;
  }
  .share-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .share-preview {
    margin-top: 12px;
    background: #f7f8fb;
    border: 1px dashed #ccd2e0;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    text-align: left;
    display: none;
  }
  .share-grid {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .share-grid.open { display: grid; }
  .sbtn {
    border: none;
    border-radius: 12px;
    padding: 9px 4px 7px;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    line-height: 1.5;
    transition: transform .12s;
  }
  .sbtn:active { transform: scale(0.94); }
  .sbtn .ic { display: block; font-size: 19px; margin-bottom: 1px; }
  .s-fb { background: #1877f2; }
  .s-tg { background: #229ed9; }
  .s-wa { background: #25d366; }
  .s-x  { background: #16181c; }
  .s-rd { background: #ff4500; }
  .s-em { background: #6b7280; }
  .s-cp { background: #4b5563; }
  .s-ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
  .share-tip {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }

  /* global stats on the result screen */
  .stats-box {
    display: none;
    background: var(--tile);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    text-align: left;
  }
  .stats-box.show { display: block; }
  .stats-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .stats-line {
    font-size: 13px;
    color: #47506b;
    margin-bottom: 4px;
  }
  .stats-line b { color: var(--ink); }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    font-size: 12px;
  }
  .bar-row .lab { width: 14px; color: var(--muted); flex: none; }
  .bar-track {
    flex: 1;
    height: 14px;
    background: #dfe3ee;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
    transition: width .5s ease;
    min-width: 2px;
  }
  .bar-fill.you { background: var(--green); }
  .bar-row .pct { width: 34px; text-align: right; color: #5a6178; flex: none; }
  .stats-sep {
    border-top: 1px solid #dbe0ec;
    margin: 10px 0 8px;
  }
  .stats-you {
    font-size: 12px;
    color: #47506b;
    margin-top: 2px;
  }

  /* join-the-group row */
  .group-row {
    display: none;
    gap: 6px;
    margin-top: 10px;
  }
  .group-row.show { display: flex; }
  .group-join {
    flex: 1;
    display: block;
    padding: 10px;
    border-radius: 12px;
    background: #229ed9;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
  }
  .group-join:active { transform: scale(0.98); }
  .group-copy {
    flex: none;
    width: 44px;
    border: none;
    border-radius: 12px;
    background: #dfe3ee;
    font-size: 16px;
    cursor: pointer;
  }
  .group-copy:active { transform: scale(0.94); }

  /* daily calendar reminder */
  .remind-row {
    display: none;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .remind-row.show { display: flex; }
  .remind-row input[type="time"] {
    border: 1px solid #dfe3ec;
    border-radius: 8px;
    padding: 4px 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--ink);
  }
  .remind-btn {
    border: none;
    background: #eef1f7;
    color: #47506b;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .remind-btn:active { transform: scale(0.96); }

  .locked-box { display: none; text-align: center; padding: 10px 0 4px; }
  .locked-box .big-lock { font-size: 40px; margin-bottom: 8px; }
  .locked-box p { color: var(--muted); font-size: 14px; }

  .week-score { text-align: center; color: #99a; font-size: 12px; margin-top: 14px; }
  .disclaimer { text-align: center; color: #667; font-size: 11px; margin-top: 6px; }
</style>

<body>
<div class="app">
  <div class="brand">
    <h1>EMOJI<span>GRAM</span></h1>

  <div class="week-score" id="weekScore"></div>

  <div class="disclaimer" style="margin-top:4px;">
    <a href="privacy.html" style="color:#667;text-decoration:underline;">Privacy</a>

</div>

<script>
// ====== CONFIG — set this after you register your bot with @BotFather ======
const BOT_USERNAME = "PlayEmojigramBot"; // no @
const SITE_URL = "https://emojigram.iynynstudios.com";  // shared when playing on the web
// Public Telegram group. Set to "" to hide the join prompt entirely.
const GROUP_URL = "https://t.me/emojigramdaily";
// Analytics (optional — see analytics-setup.md). Leave empty to disable.
const ANALYTICS_URL = "https://qadqnrjgaurxkyojhjwu.supabase.co";
const ANALYTICS_KEY = "sb_publishable_r2DisNEjlnfSrMgLewhTYA_vZZd9ld2";
// ==========================================================================

// Minimal built-in fallback (used only if puzzles.json can't be fetched,
// e.g. testing the file directly from disk). Live content comes from puzzles.json.
const FALLBACK = {
  version: 0,
  startDate: "2026-07-27",
  startRevealed: 2,
  themes: [
    { day:"Mon", theme:"Movie Monday", icon:"🎬", color:"#e74c3c", puzzles:[
      { emojis:["🚲","🌕","👽","☎️","🍬"], answer:"E.T.",
        accepted:["et","e t","extra terrestrial","the extra terrestrial"],
        fact:"The flying-bicycle silhouette became Amblin's studio logo." } ] },
    { day:"Tue", theme:"Tune Tuesday", icon:"🎵", color:"#9b59b6", puzzles:[
      { emojis:["🏨","🌴","🕯️","🍷","🚪"], answer:"Hotel California",
        accepted:["hotel california","the hotel california"],
        fact:"\"You can check out any time you like, but you can never leave.\"" } ] },
    { day:"Wed", theme:"World Wednesday", icon:"🌍", color:"#2980b9", puzzles:[
      { emojis:["🦅","🌕","👣","🚀","🇺🇸"], answer:"The Moon Landing",
        accepted:["moon landing","the moon landing","apollo 11"],
        fact:"\"The Eagle has landed\" — the lunar module was named Eagle." } ] },
    { day:"Thu", theme:"Throwback Thursday", icon:"📺", color:"#e67e22", puzzles:[
      { emojis:["☕","🛋️","⛲","👫","👬"], answer:"Friends",
        accepted:["friends","friends tv show"],
        fact:"The fountain in the credits is on a Warner Bros. lot." } ] },
    { day:"Fri", theme:"Famous Friday", icon:"👑", color:"#f1c40f", puzzles:[
      { emojis:["🦋","🐝","🥊","👑","🏆"], answer:"Muhammad Ali",
        accepted:["muhammad ali","muhammed ali","ali","cassius clay"],
        fact:"\"Float like a butterfly, sting like a bee.\"" } ] },
    { day:"Sat", theme:"Saying Saturday", icon:"💬", color:"#16a085", puzzles:[
      { emojis:["1️⃣","🔵","🌕","⏳","✨"], answer:"Once in a Blue Moon",
        accepted:["once in a blue moon","blue moon"],
        fact:"A blue moon is the second full moon in one calendar month." } ] },
    { day:"Sun", theme:"Story Sunday", icon:"📚", color:"#8e6a3f", puzzles:[
      { emojis:["🌾","🌳","🧱","🐺","🐷"], answer:"The Three Little Pigs",
        accepted:["three little pigs","the three little pigs"],
        fact:"Straw, sticks, brick — the materials ARE the plot." } ] }
  ]
};

let DATA = FALLBACK;
const NUM_EMOJI = ["0️⃣","1️⃣","2️⃣","3️⃣","4️⃣","5️⃣"];

// ---- Telegram integration ----
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
  ? window.Telegram.WebApp : null;
const inTelegram = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user);
if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

// ---- persistence: Telegram CloudStorage in-app, localStorage in browser ----
function storeGet(key) {
  return new Promise(resolve => {
    if (inTelegram && tg.CloudStorage) {
      tg.CloudStorage.getItem(key, (err, val) => resolve(err ? null : val));
    } else {
      try { resolve(localStorage.getItem(key)); } catch(e) { resolve(null); }
    }
  });
}
function storeSet(key, val) {
  if (inTelegram && tg.CloudStorage) {
    tg.CloudStorage.setItem(key, val, () => {});
  } else {
    try { localStorage.setItem(key, val); } catch(e) {}
  }
}

// ---- date helpers (local time) ----
function atMidnight(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

const TODAY = atMidnight(new Date());
const WEEKDAY = (TODAY.getDay() + 6) % 7;         // 0=Mon..6=Sun
const MONDAY = addDays(TODAY, -WEEKDAY);           // this week's Monday
const WEEK_DATES = Array.from({length: 7}, (_, i) => addDays(MONDAY, i));

function startDate() { return atMidnight(new Date(DATA.startDate + "T00:00:00")); }
function dayNumber(d) { return Math.round((atMidnight(d) - startDate()) / 864e5) + 1; }
function weekIndexFor(d, poolSize) {
  const w = Math.floor((atMidnight(d) - startDate()) / (7 * 864e5));
  return ((w % poolSize) + poolSize) % poolSize;   // loops content; safe before startDate too
}
function puzzleFor(dayIdx) {
  const theme = DATA.themes[dayIdx];
  return theme.puzzles[weekIndexFor(WEEK_DATES[dayIdx], theme.puzzles.length)];
}
function isLocked(dayIdx) { return WEEK_DATES[dayIdx] > TODAY; }

// ---- analytics (no-op unless configured; stores no personal data) ----
function getUserId() {
  if (inTelegram) return "tg_" + tg.initDataUnsafe.user.id;
  try {
    let id = localStorage.getItem("emojigram_uid");
    if (!id) { id = "web_" + Math.random().toString(36).slice(2, 12); localStorage.setItem("emojigram_uid", id); }
    return id;
  } catch(e) { return "anon"; }
}
// Coarse location: city/country only, never precise coordinates, never asks
// for GPS permission. Looked up once per browser session and cached.
let GEO = null;
function browserRegion() {
  const o = {};
  try { o.tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}
  try { o.lang = navigator.language; } catch(e) {}
  return o;
}
function loadGeo() {
  try {
    const cached = sessionStorage.getItem("emojigram_geo");
    if (cached) { GEO = JSON.parse(cached); return Promise.resolve(); }
  } catch(e) {}
  const timeout = new Promise(res => setTimeout(res, 1500));
  const lookup = fetch("https://ipwho.is/?fields=success,city,region,country,country_code")
    .then(r => r.json())
    .then(j => {
      if (j && j.success !== false) {
        GEO = { city: j.city || null, region: j.region || null,
                country: j.country || null, cc: j.country_code || null };
        try { sessionStorage.setItem("emojigram_geo", JSON.stringify(GEO)); } catch(e) {}
      }
    })
    .catch(() => {});
  return Promise.race([lookup, timeout]);
}

// Where did this player arrive from? Telegram passes ?startapp=xxx through as
// start_param, so the group's daily post can be attributed separately.
function launchSource() {
  try {
    if (inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      return String(tg.initDataUnsafe.start_param).slice(0, 24);
    }
    const q = new URLSearchParams(location.search).get("src");
    if (q) return q.slice(0, 24);
  } catch (e) {}
  return inTelegram ? "tg" : "web";
}
const SRC = launchSource();

function track(event, props) {
  if (!ANALYTICS_URL || !ANALYTICS_KEY) return;
  try {
    const p = Object.assign({}, props || {}, browserRegion(), { src: SRC });
    if (GEO) {
      p.city = GEO.city; p.region = GEO.region;
      p.country = GEO.country; p.cc = GEO.cc;
    }
    fetch(ANALYTICS_URL + "/rest/v1/events", {
      method: "POST",
      headers: {
        "apikey": ANALYTICS_KEY,
        "Authorization": "Bearer " + ANALYTICS_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ user_id: getUserId(), event: event, props: p, day: dateStr(TODAY) })
    }).catch(() => {});
  } catch(e) {}
}
const startedTracked = {};
function trackStartOnce() {
  const k = dateStr(WEEK_DATES[current]);
  if (startedTracked[k]) return;
  startedTracked[k] = true;
  track("start", { theme: DATA.themes[current].day, n: dayNumber(WEEK_DATES[current]) });
}

// ---- streak ----
let streak = 0, lastSolveDate = null;
async function loadStreak() {
  const raw = await storeGet("emojigram_streak");
  if (raw) {
    try {
      const obj = JSON.parse(raw);
      streak = obj.streak || 0;
      lastSolveDate = obj.last || null;
      if (lastSolveDate && lastSolveDate < dateStr(addDays(TODAY, -1))) streak = 0;
    } catch(e) {}
  }
  renderStreak();
}
function recordSolve() {
  const t = dateStr(TODAY);
  if (lastSolveDate === t) return;
  streak = (lastSolveDate === dateStr(addDays(TODAY, -1))) ? streak + 1 : 1;
  lastSolveDate = t;
  storeSet("emojigram_streak", JSON.stringify({ streak, last: t }));
  renderStreak();
}
function renderStreak() {
  document.getElementById("streakBar").textContent =
    streak > 0 ? `🔥 ${streak}-day streak` : "";
}

// ---- per-day results (persisted, pruned to 30 days) ----
let results = {};   // { "2026-08-03": { st: "solved"|"failed", sc: 3 } }
async function loadResults() {
  const raw = await storeGet("emojigram_days");
  if (raw) { try { results = JSON.parse(raw) || {}; } catch(e) {} }
}
function saveResult(d, st, sc) {
  results[dateStr(d)] = { st, sc };
  const keys = Object.keys(results).sort();
  while (keys.length > 30) delete results[keys.shift()];
  storeSet("emojigram_days", JSON.stringify(results));
}

// ---- session state (revealed count etc. lives per visit; outcomes persist) ----
const session = Array.from({length: 7}, () => ({ revealed: null, wrongAtFull: 0 }));
function statusOf(i) {
  const r = results[dateStr(WEEK_DATES[i])];
  return r ? r.st : "playing";
}
function scoreOf(i) {
  const r = results[dateStr(WEEK_DATES[i])];
  return r ? r.sc : null;
}

let current = WEEKDAY;
const $ = id => document.getElementById(id);

function normalize(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n+1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function isCorrect(guess, puzzle) {
  const g = normalize(guess);
  if (!g) return false;
  return puzzle.accepted.some(a => {
    const na = normalize(a);
    if (g === na) return true;
    const tol = na.length > 6 ? 2 : (na.length > 3 ? 1 : 0);
    return levenshtein(g, na) <= tol;
  });
}

function renderTabs() {
  const tabs = $("dayTabs");
  tabs.innerHTML = "";
  DATA.themes.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "day-tab" + (i === current ? " active" : "") +
                   (i === WEEKDAY ? " today" : "") +
                   (isLocked(i) ? " locked" : "") +
                   (statusOf(i) === "solved" ? " done-solved" : "");
    el.innerHTML = `<span class="demoji">${isLocked(i) ? "🔒" : t.icon}</span>${t.day}`;
    el.onclick = () => { current = i; render(); };
    tabs.appendChild(el);
  });
}

function renderTiles(justRevealedIdx) {
  const p = puzzleFor(current);
  const wrap = $("tiles");
  wrap.innerHTML = "";
  const done = statusOf(current) !== "playing";
  const revealed = session[current].revealed ?? DATA.startRevealed;
  p.emojis.forEach((e, i) => {
    const t = document.createElement("div");
    const show = !isLocked(current) && (done || i < revealed);
    t.className = "tile" + (show ? "" : " hidden-tile") + (i === justRevealedIdx ? " just-revealed" : "");
    t.textContent = show ? e : "❓";
    wrap.appendChild(t);
  });
}

function buildShareText() {
  const p = puzzleFor(current);
  const t = DATA.themes[current];
  const st = statusOf(current), sc = scoreOf(current);
  const teaser = p.emojis.slice(0, DATA.startRevealed).join("") + "❓".repeat(p.emojis.length - DATA.startRevealed);
  const n = dayNumber(WEEK_DATES[current]);
  const numLabel = n > 0 ? `#${n}` : "(preview)";
  let line;
  if (st === "solved") {
    line = `Got it in ${NUM_EMOJI[sc]}/${NUM_EMOJI[5]} — can you beat me?`;
  } else {
    line = "🙈 Stumped me today — can you get it?";
  }
  const streakLine = (st === "solved" && streak > 1) ? `\n🔥 ${streak}-day streak` : "";
  // Telegram players get the group link too — their friends are on Telegram.
  const groupLine = (inTelegram && GROUP_URL) ? `\n\nDaily puzzle group: ${GROUP_URL}` : "";
  return `Emojigram ${numLabel} · ${t.icon} ${t.theme}\n${teaser}\n${line}${streakLine}${groupLine}`;
}

// ---- global stats: how everyone did, from every channel ----
const statsCache = {};
async function fetchDailyStats(dayStr) {
  if (!ANALYTICS_URL || !ANALYTICS_KEY) return null;
  // past days are settled, so cache them; today keeps changing, so don't
  const isToday = dayStr === dateStr(TODAY);
  if (!isToday && statsCache[dayStr] !== undefined) return statsCache[dayStr];
  try {
    const r = await fetch(ANALYTICS_URL + "/rest/v1/rpc/daily_stats", {
      method: "POST",
      headers: {
        apikey: ANALYTICS_KEY,
        Authorization: "Bearer " + ANALYTICS_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ d: dayStr })
    });
    const j = await r.json();
    statsCache[dayStr] = (j && typeof j.players === "number") ? j : null;
  } catch (e) {
    statsCache[dayStr] = null;
  }
  return statsCache[dayStr];
}

const MIN_PLAYERS = 3;   // below this the percentages are meaningless

function barRow(score, count, total, isYou) {
  const pct = total ? Math.round(100 * count / total) : 0;
  return '<div class="bar-row">' +
           '<div class="lab">' + score + '</div>' +
           '<div class="bar-track"><div class="bar-fill' + (isYou ? " you" : "") +
             '" style="width:' + Math.max(pct, count ? 3 : 0) + '%"></div></div>' +
           '<div class="pct">' + pct + '%</div>' +
         '</div>';
}

async function renderStats() {
  const box = $("statsBox");
  box.classList.remove("show");
  box.innerHTML = "";

  const dayStr = dateStr(WEEK_DATES[current]);
  const myScore = scoreOf(current);
  const [today, yest] = await Promise.all([
    fetchDailyStats(dayStr),
    fetchDailyStats(dateStr(addDays(WEEK_DATES[current], -1)))
  ]);

  let html = "";

  if (today && today.players >= MIN_PLAYERS) {
    const solvedPct = Math.round(100 * today.solved / today.players);
    html += '<div class="stats-title">How everyone did today</div>';
    html += '<div class="stats-line"><b>' + solvedPct + '%</b> of players solved it</div>';
    const dist = [today.s2, today.s3, today.s4, today.s5];
    for (let i = 0; i < 4; i++) {
      html += barRow(i + 2, dist[i], today.players, myScore === i + 2);
    }
    if (myScore) {
      const better = dist.slice(0, myScore - 2).reduce((a, b) => a + b, 0);
      const pctBetter = Math.round(100 * better / today.players);
      html += '<div class="stats-you">You got it in <b>' + myScore + '</b> — ' +
              (pctBetter === 0
                ? "nobody did better today 🏆"
                : "only " + pctBetter + "% did better") + '</div>';
    }
  } else if (today) {
    html += '<div class="stats-title">How everyone did today</div>';
    html += '<div class="stats-line">You\'re early today 🌱 — check back later to see how everyone did</div>';
  }

  // yesterday: the global number plus a reminder of your own result
  const yDay = dateStr(addDays(WEEK_DATES[current], -1));
  const yMine = results[yDay];
  if ((yest && yest.players >= MIN_PLAYERS) || yMine) {
    html += '<div class="stats-sep"></div>';
    html += '<div class="stats-title">Yesterday</div>';
    if (yest && yest.players >= MIN_PLAYERS) {
      const yPct = Math.round(100 * yest.solved / yest.players);
      html += '<div class="stats-line"><b>' + yPct + '%</b> of players solved it</div>';
    }
    if (yMine) {
      html += '<div class="stats-you">' +
        (yMine.st === "solved"
          ? "You got it in <b>" + yMine.sc + "</b> ✅"
          : "You didn't get that one 🙈") + '</div>';
    } else {
      html += '<div class="stats-you">You didn\'t play yesterday</div>';
    }
  }

  if (html) {
    box.innerHTML = html;
    box.classList.add("show");
  }
}

function renderResult() {
  const p = puzzleFor(current);
  const st = statusOf(current), sc = scoreOf(current);
  $("result").style.display = "block";
  if (st === "solved") {
    const flair = sc === 2 ? "🏆 ELITE!" : sc === 3 ? "🔥 Sharp!" : sc === 4 ? "👏 Nice!" : "✅ Got there!";
    $("resultBig").textContent = `${flair} Solved in ${sc}/5`;
  } else {
    $("resultBig").textContent = "🙈 Stumped!";
  }
  $("answerLine").innerHTML = `The answer was <b>${p.answer}</b> — ${p.emojis.join(" ")}`;
  $("factBox").textContent = "💡 " + p.fact;
  $("sharePreview").style.display = "none";
  $("shareBtn").textContent = "📣 Share with your friends";
  if (GROUP_URL) $("groupRow").classList.add("show");
  // Telegram already has its own reminders; the .ics is for web players.
  if (!inTelegram) $("remindRow").classList.add("show");
  renderStats();   // async — fills in once the numbers arrive
}

function renderWeekScore() {
  let solved = 0, played = 0, total = 0;
  for (let i = 0; i < 7; i++) {
    const st = statusOf(i);
    if (st !== "playing") played++;
    if (st === "solved") { solved++; total += scoreOf(i); }
  }
  $("weekScore").textContent = played
    ? `This week: ${solved}/${played} solved` + (solved ? ` · total score ${total} (lower is better)` : "")
    : "One puzzle a day — today is marked with a dot";
}

function render(justRevealedIdx) {
  const t = DATA.themes[current];
  document.documentElement.style.setProperty("--accent", t.color);
  $("themeName").textContent = `${t.icon} ${t.theme}`;
  $("themeName").style.background = t.color;
  const n = dayNumber(WEEK_DATES[current]);
  $("puzzleNum").textContent = n > 0 ? `Emojigram #${n}` : "Emojigram (preview)";
  renderTabs();
  renderTiles(justRevealedIdx);

  $("playArea").style.display = "none";
  $("result").style.display = "none";
  $("lockedBox").style.display = "none";

  if (isLocked(current)) {
    $("lockedBox").style.display = "block";
    $("lockedText").textContent = `${t.theme} unlocks ${WEEK_DATES[current].toLocaleDateString(undefined, { weekday: "long" })} — come back!`;
  } else if (statusOf(current) === "playing") {
    if (session[current].revealed === null) session[current].revealed = DATA.startRevealed;
    $("playArea").style.display = "block";
    $("feedback").textContent = "";
    $("guessInput").value = "";
    $("hintBtn").style.display = session[current].revealed < 5 ? "inline" : "none";
    $("giveupBtn").style.display = (session[current].revealed >= 5 && session[current].wrongAtFull >= 1) ? "inline" : "none";
  } else {
    renderResult();
  }
  renderWeekScore();
}

function reveal() {
  const s = session[current];
  if (s.revealed < 5) {
    s.revealed++;
    render(s.revealed - 1);
    return true;
  }
  return false;
}

function handleGuess() {
  if (isLocked(current) || statusOf(current) !== "playing") return;
  const p = puzzleFor(current);
  const s = session[current];
  const guess = $("guessInput").value;
  if (!normalize(guess)) return;
  trackStartOnce();
  if (isCorrect(guess, p)) {
    saveResult(WEEK_DATES[current], "solved", s.revealed);
    if (current === WEEKDAY) recordSolve();   // only today's puzzle feeds the streak
    track("solve", { theme: DATA.themes[current].day, n: dayNumber(WEEK_DATES[current]), score: s.revealed, streak: streak });
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("success"); } catch(e) {} }
    render();
    // the solve was just posted; re-pull the numbers so the player is included
    setTimeout(renderStats, 1200);
  } else {
    $("card").classList.remove("shake");
    void $("card").offsetWidth;
    $("card").classList.add("shake");
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("error"); } catch(e) {} }
    if (s.revealed < 5) {
      reveal();
      $("feedback").textContent = "Nope — here's another emoji";
    } else {
      s.wrongAtFull++;
      render();
      $("feedback").textContent = "Not it — try again";
    }
    $("guessInput").value = "";
    $("guessInput").focus();
  }
}

$("guessBtn").onclick = handleGuess;
$("guessInput").addEventListener("keydown", e => { if (e.key === "Enter") handleGuess(); });
$("hintBtn").onclick = () => { trackStartOnce(); reveal(); };
$("giveupBtn").onclick = () => {
  saveResult(WEEK_DATES[current], "failed", null);
  track("fail", { theme: DATA.themes[current].day, n: dayNumber(WEEK_DATES[current]) });
  render();
};

// ---- sharing ----
function trackShare(where) {
  track("share", {
    theme: DATA.themes[current].day,
    n: dayNumber(WEEK_DATES[current]),
    solved: statusOf(current) === "solved",
    via: where
  });
}

async function copyCard(showPreview) {
  const webText = buildShareText() + "\n" + SITE_URL;
  try {
    await navigator.clipboard.writeText(webText);
    return true;
  } catch (e) {
    if (showPreview) {
      const prev = $("sharePreview");
      prev.textContent = webText;
      prev.style.display = "block";
    }
    return false;
  }
}

// Networks that support pre-filled web sharing. Instagram and TikTok do not
// allow it at all — they are reachable only through the device share sheet.
const NETWORKS = [
  { key:"fb", cls:"s-fb", ic:"f",  label:"Facebook",
    url: (t,u) => "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(u) + "&quote=" + encodeURIComponent(t) },
  { key:"tg", cls:"s-tg", ic:"✈️", label:"Telegram",
    url: (t,u) => "https://t.me/share/url?url=" + encodeURIComponent(u) + "&text=" + encodeURIComponent(t) },
  { key:"wa", cls:"s-wa", ic:"💬", label:"WhatsApp",
    url: (t,u) => "https://api.whatsapp.com/send?text=" + encodeURIComponent(t + "\n" + u) },
  { key:"x",  cls:"s-x",  ic:"𝕏",  label:"X",
    url: (t,u) => "https://twitter.com/intent/tweet?text=" + encodeURIComponent(t) + "&url=" + encodeURIComponent(u) },
  { key:"rd", cls:"s-rd", ic:"👽", label:"Reddit",
    url: (t,u) => "https://www.reddit.com/submit?url=" + encodeURIComponent(u) + "&title=" + encodeURIComponent(t.split("\n")[0]) },
  { key:"em", cls:"s-em", ic:"✉️", label:"Email",
    url: (t,u) => "mailto:?subject=" + encodeURIComponent("Can you beat my Emojigram score?") + "&body=" + encodeURIComponent(t + "\n" + u) }
];

function buildShareGrid() {
  const grid = $("shareGrid");
  if (grid.dataset.built) return;
  grid.dataset.built = "1";

  NETWORKS.forEach(function (n) {
    const b = document.createElement("button");
    b.className = "sbtn " + n.cls;
    b.innerHTML = '<span class="ic">' + n.ic + '</span>' + n.label;
    b.onclick = function () {
      trackShare(n.key);
      window.open(n.url(buildShareText(), SITE_URL), "_blank", "noopener,width=650,height=550");
    };
    grid.appendChild(b);
  });

  // Instagram / TikTok: no web share endpoint exists, so copy the card for pasting.
  const ig = document.createElement("button");
  ig.className = "sbtn s-ig";
  ig.innerHTML = '<span class="ic">📸</span>IG / TikTok';
  ig.onclick = async function () {
    trackShare("ig_copy");
    const ok = await copyCard(true);
    ig.innerHTML = ok ? '<span class="ic">✅</span>Copied!' : '<span class="ic">👇</span>Copy below';
    setTimeout(function () { ig.innerHTML = '<span class="ic">📸</span>IG / TikTok'; }, 2500);
  };
  grid.appendChild(ig);

  const cp = document.createElement("button");
  cp.className = "sbtn s-cp";
  cp.innerHTML = '<span class="ic">📋</span>Copy';
  cp.onclick = async function () {
    trackShare("copy");
    const ok = await copyCard(true);
    cp.innerHTML = ok ? '<span class="ic">✅</span>Copied!' : '<span class="ic">👇</span>Below';
    setTimeout(function () { cp.innerHTML = '<span class="ic">📋</span>Copy'; }, 2500);
  };
  grid.appendChild(cp);
}

$("shareBtn").onclick = async () => {
  const text = buildShareText();

  // 1. Inside Telegram: native chat picker
  if (inTelegram) {
    trackShare("telegram");
    const url = "https://t.me/" + BOT_USERNAME + "/play";
    tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
    return;
  }

  // 2. Phones/tablets: the OS share sheet — Instagram, TikTok, Messages and
  //    every other installed app, in one tap.
  if (navigator.share) {
    try {
      trackShare("native");
      await navigator.share({ title: "Emojigram", text: text, url: SITE_URL });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;   // user dismissed the sheet
      // any other error: fall through to the buttons
    }
  }

  // 3. Desktop: per-network buttons
  buildShareGrid();
  $("shareGrid").classList.add("open");
  $("shareTip").textContent = "Instagram & TikTok don't allow pre-filled posts — tap 📸 to copy the card, then paste it into your story or caption.";
  $("shareBtn").textContent = "📣 Share with your friends";
};

// ---- daily calendar reminder (.ics) ----
// Uses a "floating" time — no timezone attached — so the reminder fires at the
// chosen local time wherever the person is, and stays correct across DST.
function pad(n) { return String(n).padStart(2, "0"); }

function buildICS(hh, mm) {
  const start = new Date();
  start.setHours(hh, mm, 0, 0);
  if (start <= new Date()) start.setDate(start.getDate() + 1);   // start tomorrow if today's time has passed

  const d = start.getFullYear() + pad(start.getMonth() + 1) + pad(start.getDate());
  const t = pad(hh) + pad(mm) + "00";
  const end = new Date(start.getTime() + 10 * 60000);
  const te = pad(end.getHours()) + pad(end.getMinutes()) + "00";
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const uid = "emojigram-daily-" + Date.now() + "@iynynstudios.com";

  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//IYNYN Studios//Emojigram//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + stamp,
    "DTSTART:" + d + "T" + t,
    "DTEND:" + d + "T" + te,
    "RRULE:FREQ=DAILY",
    "SUMMARY:🚲🌕 Emojigram — today's puzzle",
    "DESCRIPTION:A new emoji puzzle every day. Guess it in as few emojis as you can.\\n\\nPlay: " + SITE_URL,
    "URL:" + SITE_URL,
    "TRANSP:TRANSPARENT",
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:Today's Emojigram is ready 🚲🌕",
    "TRIGGER:PT0S",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
}

if (GROUP_URL !== undefined) {
  $("remindBtn").onclick = () => {
    const val = $("remindTime").value || "08:00";
    const [hh, mm] = val.split(":").map(Number);
    track("calendar_add", { time: val });

    const ics = buildICS(hh, mm);
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "emojigram-daily-reminder.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    const btn = $("remindBtn");
    btn.textContent = "✅ Added";
    setTimeout(() => { btn.textContent = "Add to calendar"; }, 3000);
  };
}

// ---- join / share the group ----
if (GROUP_URL) {
  const joinEl = $("groupJoin");
  joinEl.href = GROUP_URL;
  joinEl.onclick = (e) => {
    track("group_join", { via: inTelegram ? "tg" : "web" });
    if (inTelegram && tg.openTelegramLink) {
      e.preventDefault();
      tg.openTelegramLink(GROUP_URL);   // opens in-app rather than a browser
    }
  };
  $("groupCopy").onclick = async () => {
    track("group_copy", {});
    const btn = $("groupCopy");
    try {
      await navigator.clipboard.writeText(GROUP_URL);
      btn.textContent = "✅";
    } catch {
      const prev = $("sharePreview");
      prev.textContent = GROUP_URL;
      prev.style.display = "block";
      btn.textContent = "👇";
    }
    setTimeout(() => { btn.textContent = "🔗"; }, 2000);
  };
}

if (inTelegram) {
  $("envNote").textContent =
    `Playing as ${tg.initDataUnsafe.user.first_name} · progress syncs to your Telegram account`;
} else {
  // Web players: point them at the Telegram group, which is the better home
  // for the game — synced streaks, daily post, and other players.
  $("envNote").innerHTML =
    'Play on Telegram and join others in the fun — ' +
    '<a href="' + (GROUP_URL || "#") + '" target="_blank" rel="noopener" ' +
    'style="color:#7fb5ff;text-decoration:underline;font-weight:600;">' +
    'get the daily puzzle in your chat 🚲🌕</a>';
  const gl = $("envNote").querySelector("a");
  if (gl) gl.onclick = () => track("group_join", { via: "footer" });
}

// ---- boot: load content, then saved state, then render ----
(async function init() {
  try {
    const resp = await fetch("puzzles.json", { cache: "no-store" });
    if (resp.ok) {
      const json = await resp.json();
      if (json && json.themes && json.themes.length === 7) DATA = json;
    }
  } catch(e) { /* fallback content stays */ }
  await loadResults();
  await loadStreak();
  render();                 // draw first, don't make the player wait on analytics
  await loadGeo();
  track("open", { tg: inTelegram });
})();

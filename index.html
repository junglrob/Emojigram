<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emojigram</title>
<style>
  :root {
    --bg1: #1a1a2e; --bg2: #16213e;
    --card: #ffffff; --ink: #1f2430; --muted: #8a90a0;
    --accent: #e94560; --tile: #f0f2f7; --tile-hidden: #e2e5ee; --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex; align-items: flex-start; justify-content: center;
    padding: 16px 12px; color: var(--ink);
  }
  .app { width: 100%; max-width: 440px; }

  .brand { text-align: center; color: #fff; margin-bottom: 8px; }
  .brand h1 { font-size: 24px; letter-spacing: 1px; }
  .brand h1 span { color: var(--accent); }
  .brand p { color: #aab; font-size: 12px; margin-top: 2px; }

  .streak-bar { display: flex; justify-content: center; margin-bottom: 12px; min-height: 4px; }
  .streak-badge {
    position: relative; display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 16px 8px 12px; border-radius: 16px;
    background: linear-gradient(135deg, #ff9500, #ff5722 55%, #e0342b);
    box-shadow: 0 4px 18px rgba(255,106,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
    color: #fff;
  }
  .streak-badge::before {
    content: ""; position: absolute; inset: -6px; border-radius: 22px;
    background: radial-gradient(ellipse at center, rgba(255,150,0,.55), rgba(255,80,0,0) 70%);
    z-index: -1; animation: flicker 2.2s ease-in-out infinite;
  }
  .streak-flame {
    font-size: 22px; line-height: 1;
    animation: flameDance 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,220,120,.9));
  }
  .streak-num { font-size: 20px; font-weight: 800; line-height: 1; }
  .streak-word {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; opacity: .92; line-height: 1.2; max-width: 105px;
  }
  .streak-stack { display: flex; flex-direction: column; align-items: flex-start; }
  @keyframes flameDance { 0%,100% { transform: scale(1) rotate(-3deg);} 50% { transform: scale(1.14) rotate(3deg);} }
  @keyframes flicker { 0%,100% { opacity:.85; transform:scale(1);} 45% { opacity:1; transform:scale(1.06);} 70% { opacity:.75; transform:scale(.98);} }

  .card { background: var(--card); border-radius: 18px; padding: 20px 18px;
          box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .theme-name { display:inline-block; font-weight: 700; font-size: 16px;
                padding: 4px 12px; border-radius: 999px; color:#fff; margin-bottom: 12px; }

  .tiles { display: flex; gap: 8px; justify-content: center; margin: 6px 0 16px; }
  .tile {
    width: 60px; height: 60px; border-radius: 14px; background: var(--tile);
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .tile.hidden-tile { background: var(--tile-hidden); color: #b9bdcc; font-size: 22px; }
  .tile.just-revealed { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.3) rotate(-12deg);} 70% { transform: scale(1.15);} 100% { transform: scale(1);} }

  .guess-row { display: flex; gap: 8px; }
  .guess-row input {
    flex: 1; padding: 12px 14px; border: 2px solid #dfe3ec;
    border-radius: 12px; font-size: 15px; outline: none;
  }
  .guess-row input:focus { border-color: var(--accent); }
  .guess-row button {
    padding: 12px 18px; border: none; border-radius: 12px;
    background: var(--accent); color:#fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .aux-row { display:flex; justify-content:space-between; align-items:center;
             margin-top: 10px; min-height: 22px; }
  .giveup-btn { background:none; border:none; color:#c0392b; font-size:13px;
                cursor:pointer; text-decoration:underline; display:none; }
  .feedback { font-size: 13px; color: #c0392b; font-weight: 600; }

  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);}
                     40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }

  .result { display:none; text-align:center; margin-top: 4px; }
  .result .big { font-size: 19px; font-weight: 800; }
  .result-sub { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .answer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
                  color: var(--muted); font-weight: 700; margin-top: 10px; }
  .answer-text { font-size: 24px; font-weight: 800; line-height: 1.15; margin-bottom: 12px; }
  .fact { background: var(--tile); border-radius: 12px; padding: 10px 14px;
          font-size: 12.5px; color:#555c6e; margin-bottom: 12px; text-align:left; }

  .stats-box { background: var(--tile); border-radius: 12px; padding: 12px 14px;
               margin-bottom: 12px; text-align:left; display:none; }
  .stats-box.show { display:block; }
  .stats-title { font-size:10px; text-transform:uppercase; letter-spacing:.5px;
                 color:var(--muted); font-weight:700; margin-bottom:6px; }
  .stats-line { font-size:12.5px; color:#47506b; margin-bottom:4px; }
  .stats-line b { color: var(--ink); }
  .stats-caption { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px;
                   color:var(--muted); margin:8px 0 4px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:3px; font-size:12px; }
  .bar-row .lab { width:12px; color:var(--muted); flex:none; }
  .bar-track { flex:1; height:13px; background:#dfe3ee; border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; background:var(--accent); transition:width .5s ease; }
  .bar-fill.you { background: var(--green); }
  .bar-row .pct { width:32px; text-align:right; color:#5a6178; flex:none; }
  .stats-sep { border-top:1px solid #dbe0ec; margin:10px 0 8px; }
  .stats-you { font-size:11.5px; color:#47506b; margin-top:2px; }

  .share-btn { width:100%; padding:12px; border:none; border-radius:12px;
               background:var(--green); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  .loading { text-align:center; color:#aab; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>EMOJI<span>GRAM</span></h1>
    <p>Guess it in as few emojis as you can</p>
  </div>

  <div class="streak-bar" id="streakBar"></div>

  <div class="card">
    <div id="loading" class="loading">Loading today's puzzle…</div>

    <div id="game" style="display:none">
      <div class="theme-name" id="themeName"></div>
      <div class="tiles" id="tiles"></div>

      <div id="playArea">
        <div class="guess-row">
          <input type="text" id="guessInput" placeholder="Type your guess..." autocomplete="off">
          <button id="guessBtn">Guess</button>
        </div>
        <div class="aux-row">
          <button class="giveup-btn" id="giveupBtn">Give up</button>
          <div class="feedback" id="feedback"></div>
        </div>
      </div>

      <div class="result" id="result">
        <div class="big" id="resultBig"></div>
        <div class="answer-label">The answer was</div>
        <div class="answer-text" id="answerText"></div>
        <div class="fact" id="factBox"></div>
        <div class="stats-box" id="statsBox"></div>
        <button class="share-btn" id="shareBtn">💬 Post your score in the comments</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let STATE = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function renderStreak(n) {
  $("streakBar").innerHTML = n > 0
    ? '<div class="streak-badge"><span class="streak-flame">🔥</span>' +
      '<div class="streak-stack"><span class="streak-num">' + n + '</span>' +
      '<span class="streak-word">' + (n === 1 ? "day solved" : "days solved in a row") +
      '</span></div></div>'
    : "";
}

function renderTiles(emojis, total, justRevealed) {
  const wrap = $("tiles");
  wrap.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const t = document.createElement("div");
    const shown = i < emojis.length;
    t.className = "tile" + (shown ? "" : " hidden-tile") + (i === justRevealed ? " just-revealed" : "");
    t.textContent = shown ? emojis[i] : "❓";
    wrap.appendChild(t);
  }
}

function barRow(score, count, total, isYou) {
  const pct = total ? Math.round(100 * count / total) : 0;
  return '<div class="bar-row"><div class="lab">' + score + '</div>' +
         '<div class="bar-track"><div class="bar-fill' + (isYou ? " you" : "") +
         '" style="width:' + Math.max(pct, count ? 3 : 0) + '%"></div></div>' +
         '<div class="pct">' + pct + '%</div></div>';
}

function renderStats(stats, myScore, yesterday) {
  const box = $("statsBox");
  let html = "";
  const MIN = 3;

  if (stats && stats.players >= MIN) {
    const pct = Math.round(100 * stats.solved / stats.players);
    html += '<div class="stats-title">How everyone did today</div>';
    html += '<div class="stats-line"><b>' + pct + '%</b> of players solved it</div>';
    html += '<div class="stats-caption">Emoji clues needed</div>';
    const dist = [stats.s2, stats.s3, stats.s4, stats.s5];
    for (let i = 0; i < 4; i++) html += barRow(i + 2, dist[i], stats.players, myScore === i + 2);
    if (myScore) {
      const better = dist.slice(0, myScore - 2).reduce((a, b) => a + b, 0);
      const pb = Math.round(100 * better / stats.players);
      html += '<div class="stats-you">You needed <b>' + myScore + '</b> clues — ' +
              (pb === 0 ? "nobody did better today 🏆" : "only " + pb + "% did better") + '</div>';
    }
  } else if (stats) {
    html += '<div class="stats-title">How everyone did today</div>';
    html += '<div class="stats-line">You\'re early today 🌱 — check back later</div>';
  }

  const y = yesterday || {};
  if ((y.stats && y.stats.players >= MIN) || y.mine) {
    html += '<div class="stats-sep"></div><div class="stats-title">Yesterday</div>';
    if (y.stats && y.stats.players >= MIN) {
      const yp = Math.round(100 * y.stats.solved / y.stats.players);
      html += '<div class="stats-line"><b>' + yp + '%</b> of players solved it</div>';
    }
    if (y.mine) {
      html += '<div class="stats-you">' +
        (y.mine.status === "solved"
          ? "You needed <b>" + y.mine.score + "</b> clues ✅"
          : "You didn't get that one 🙈") + '</div>';
    } else {
      html += '<div class="stats-you">You didn\'t play yesterday</div>';
    }
  }

  if (html) { box.innerHTML = html; box.classList.add("show"); }
  else { box.classList.remove("show"); }
}

function showResult(status, score, answer, fact, stats) {
  $("playArea").style.display = "none";
  $("result").style.display = "block";
  if (status === "solved") {
    const flair = score === 2 ? "🏆 ELITE!" : score === 3 ? "🔥 Sharp!" : score === 4 ? "👏 Nice!" : "✅ Got there!";
    const how = score === 2 ? "just 2 emoji clues" : score + " emoji clues";
    $("resultBig").innerHTML = flair + '<div class="result-sub">Solved with ' + how + '</div>';
  } else {
    $("resultBig").innerHTML = '🙈 Stumped!<div class="result-sub">All 5 clues and it still got away</div>';
  }
  $("answerText").textContent = answer;
  $("factBox").textContent = "💡 " + fact;
  renderStats(stats, status === "solved" ? score : null, STATE.yesterday);
}

async function boot() {
  STATE = await api("/api/state");
  $("loading").style.display = "none";
  $("game").style.display = "block";

  $("themeName").textContent = STATE.theme.icon + " " + STATE.theme.name;
  $("themeName").style.background = STATE.theme.color;
  document.documentElement.style.setProperty("--accent", STATE.theme.color);

  renderStreak(STATE.streak);
  renderTiles(STATE.emojis, STATE.total);

  if (STATE.status !== "playing") {
    showResult(STATE.status, STATE.score, STATE.answer, STATE.fact, STATE.stats);
  } else if (STATE.revealed >= STATE.total) {
    $("giveupBtn").style.display = "inline";
  }
}

async function submitGuess() {
  const val = $("guessInput").value.trim();
  if (!val) return;
  $("guessInput").value = "";

  const r = await api("/api/guess", { guess: val });

  if (r.correct || r.already) {
    if (r.streak) renderStreak(r.streak);
    renderTiles(r.emojis, r.emojis.length);
    showResult(r.already ? r.status : "solved", r.score, r.answer, r.fact, r.stats);
    return;
  }

  renderTiles(r.emojis, STATE.total, r.revealed - 1);
  $("feedback").textContent = r.exhausted ? "Not it — try again" : "Nope — here's another emoji";
  const card = document.querySelector(".card");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  if (r.exhausted) $("giveupBtn").style.display = "inline";
  $("guessInput").focus();
}

$("guessBtn").onclick = submitGuess;
$("guessInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitGuess(); });
$("giveupBtn").onclick = async () => {
  const r = await api("/api/giveup", {});
  renderTiles(r.emojis, r.emojis.length);
  showResult("failed", null, r.answer, r.fact, r.stats);
};

// Sharing on Reddit means commenting — copy the score card for pasting.
$("shareBtn").onclick = async () => {
  const teaser = STATE.emojis.slice(0, 2).join("") + "❓❓❓";
  const line = STATE.status === "solved" || $("answerText").textContent
    ? "Got it with " + ($("answerText").dataset.score || "") + " hints"
    : "";
  const txt = teaser + "  " + (line || "") + "\n(no spoilers 🤫)";
  try {
    await navigator.clipboard.writeText(txt);
    $("shareBtn").textContent = "✅ Copied — paste it in the comments";
  } catch {
    $("shareBtn").textContent = "Comment your score below 👇";
  }
  setTimeout(() => { $("shareBtn").textContent = "💬 Post your score in the comments"; }, 2500);
};

boot();
</script>
</body>
</html>
